  parameters:
    
    CourseCode:
      name: course
      in: path
      required: true
      description: Unique code of the course.
      schema:
        type: string
        pattern: '^[A-Z0-9_-]+$'
        minLength: 3
        maxLength: 14
        example: ISC123
  
  securitySchemes:
    
    sanctum:
      type: apiKey
      in: cookie
      name: webcis-api-session
      description: |
        Laravel Sanctum session cookie used to authenticate SPA requests.
        The client must first obtain a CSRF cookie and then authenticate
        through the login endpoint.
